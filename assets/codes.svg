<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <!-- Terminal -->
  <rect x="5" y="5" width="790" height="410" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"></rect>

  <!-- Barra superior -->
  <rect x="5" y="5" width="790" height="55" rx="14" fill="#161b22"></rect>

  <!-- Botões -->
  <circle cx="30" cy="32" r="8" fill="#ff5f56"></circle>
  <circle cx="55" cy="32" r="8" fill="#ffbd2e"></circle>
  <circle cx="80" cy="32" r="8" fill="#27c93f"></circle>

  <!-- Título -->
  <text x="400" y="37" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="14">
    isabellatsk@github
  </text>

  <!-- Prompt -->
  <text x="35" y="105" fill="#feb4d7" font-family="monospace" font-size="18">
    $ ./welcome.sh
  </text>

  <!-- Linha 1 -->
  <clipPath id="line1">
    <rect x="35" y="125" width="0" height="30">
      <animate
        attributeName="width"
        values="0;650;650;0"
        keyTimes="0;0.25;0.9;1"
        dur="8s"
        repeatCount="indefinite"
      ></animate>
    </rect>
  </clipPath>

  <text x="35" y="150" fill="#feb4d7" font-family="monospace" font-size="18" clip-path="url(#line1)">
    Hello Guys! I'm Isa :)
  </text>

  <!-- Linha 2 -->
  <clipPath id="line2">
    <rect x="35" y="165" width="0" height="30">
      <animate
        attributeName="width"
        values="0;0;700;700;0"
        keyTimes="0;0.35;0.48;0.9;1"
        dur="8s"
        repeatCount="indefinite"
      ></animate>
    </rect>
  </clipPath>

  <text x="35" y="190" fill="#F7A8C4" font-family="monospace" font-size="18" clip-path="url(#line2)">
    Welcome to this part of my world...
  </text>

  <!-- Linha 3 -->
  <clipPath id="line3">
    <rect x="35" y="205" width="0" height="30">
      <animate
        attributeName="width"
        values="0;0;400;400;0"
        keyTimes="0;0.70;0.81;0.9;1"
        dur="8s"
        repeatCount="indefinite"
      ></animate>
    </rect>
  </clipPath>

  <text x="35" y="230" fill="#feb4d7" font-family="monospace" font-size="18" clip-path="url(#line3)">
    Nice to meet you!
  </text>

  <!-- Cursor piscando -->
  <rect x="35" y="260" width="10" height="20" fill="#feb4d7">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"></animate>
  </rect>
</svg>